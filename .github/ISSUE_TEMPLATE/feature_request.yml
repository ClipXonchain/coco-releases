name: Suggest something
description: An idea for Coco.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Coco to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: What are you trying to follow or not miss?
