name: Something isn't working
description: Coco crashed, an alert didn't show, or something looks wrong.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Coco version
      description: Click the Coco icon in the menu bar, then About, or Settings › About.
      placeholder: "0.1.6"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.4, MacBook Pro 14-inch (M3)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you saw instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it ourselves?
      placeholder: "1. Open the X tab\n2. Tap Voices\n3. ..."
  - type: markdown
    attributes:
      value: Please don't paste passwords, Premium keys or Telegram messages.
